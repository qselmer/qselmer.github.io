name: Apply requested web refinements

on:
  push:
    branches:
      - apply-web-refinements-20260914

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: apply-web-refinements-20260914
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply source refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          ROOT = Path('.')

          def replace_once(path: str, old: str, new: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:90]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Move the project-stage note to the end of Research.
          research = ROOT / 'projects/index.qmd'
          text = research.read_text(encoding='utf-8')
          note = '''::: {.qs-footnote-note}
          **Project-stage note.** This catalogue includes active analyses, manuscripts in development, reusable research infrastructure, and planned studies. The stage shown on each card describes its current maturity; inclusion here does not imply that all projects are being pursued simultaneously.
          :::'''
          if note not in text:
              raise SystemExit('Project-stage note not found')
          text = text.replace(note + '\n\n', '', 1)
          text = text.rstrip() + '\n\n' + note + '\n'
          research.write_text(text, encoding='utf-8')

          # 2) Use one canonical professional identity everywhere generated by the site.
          replace_once(
              'scripts/build_home.py',
              '<p class="qs-sidebar-role">Marine Quantitative Ecologist<br>Fisheries Scientist</p>',
              '<p class="qs-sidebar-role">{html.escape(str(identity["headline"]))}</p>',
          )
          replace_once(
              'contact/index.qmd',
              'Marine Quantitative Ecologist · Fisheries Scientist',
              'Quantitative Fisheries Scientist',
          )

          post = ROOT / 'scripts/postprocess_site.py'
          post_text = post.read_text(encoding='utf-8')
          if 'CONFIG = ROOT / "config" / "site.json"' not in post_text:
              post_text = post_text.replace(
                  'BLOG = ROOT / "blog" / "registry.json"\nPERSON_ID = SITE_URL + "/#person"',
                  'BLOG = ROOT / "blog" / "registry.json"\nCONFIG = ROOT / "config" / "site.json"\nPERSON_ID = SITE_URL + "/#person"',
                  1,
              )
          old_person = 'def person_schema() -> dict:\n    return {'
          new_person = 'def person_schema() -> dict:\n    identity = load_json(CONFIG).get("identity") or {}\n    headline = str(identity.get("headline") or "Quantitative Fisheries Scientist")\n    return {'
          if old_person not in post_text:
              raise SystemExit('person_schema() entry point not found')
          post_text = post_text.replace(old_person, new_person, 1)
          old_job = '"jobTitle": ["Marine Quantitative Ecologist", "Fisheries Scientist"],'
          if old_job not in post_text:
              raise SystemExit('Legacy JSON-LD jobTitle not found')
          post_text = post_text.replace(old_job, '"jobTitle": headline,', 1)
          post.write_text(post_text, encoding='utf-8')

          # 3) Attach official IMARPE public URLs to the two verified open reports.
          pubs_path = ROOT / 'assets/data/publications.json'
          payload = json.loads(pubs_path.read_text(encoding='utf-8'))
          targets = {
              'Decision-table protocol for seasonal catch advice in the north-central Peruvian anchovy fishery':
                  'https://www.gob.pe/institucion/imarpe/informes-publicaciones/7947433-elaboracion-de-las-tablas-de-decision-para-la-determinacion-del-limite-maximo-total-de-captura-permisible-por-temporada-de-pesca-en-la-pesqueria-del-stock-norte-centro-de-la-anchoveta-peruana',
              'North-central Peruvian anchovy stock status and 2026 first-season exploitation outlook':
                  'https://www.gob.pe/institucion/imarpe/informes-publicaciones/7960391-informe-correspondiente-al-oficio-n-0507-2026-imarpe-pe',
          }
          found = set()
          for item in payload.get('publications', []):
              title = item.get('title')
              if title in targets:
                  item['url'] = targets[title]
                  item['open_access'] = True
                  found.add(title)
          missing = set(targets) - found
          if missing:
              raise SystemExit(f'Missing publication records: {sorted(missing)}')
          pubs_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 4) Make repository visibility explicit on every Research card.
          projects_script = ROOT / 'scripts/build_projects.py'
          script = projects_script.read_text(encoding='utf-8')
          pattern = re.compile(r'def render_card\(project: dict\) -> list\[str\]:.*?\n\ndef render_output', re.S)
          replacement = '''def render_card(project: dict) -> list[str]:
              """Render a GitHub-backed project while making maturity and repository visibility explicit."""
              slug = clean_class(project.get("slug"), "project slug")
              title = str(project.get("title") or "").strip()
              summary = str(project.get("summary") or "").strip()
              context = str(project.get("context") or "").strip()
              stage = str(project.get("stage") or "").strip()
              repository = str(project.get("source_repository") or "").strip()
              site_path = str(project.get("site_path") or "").strip()
              if not all((title, summary, context, stage, repository)):
                  raise RuntimeError(f"Project {slug} is missing card content, stage, or source_repository")

              repository_url = f"https://github.com/{repository}"
              is_private = bool(site_path) and not re.match(r"^https?://", site_path, flags=re.I)
              target = site_path if is_private else repository_url
              visibility = "Private repository" if is_private else "Public repository"
              visibility_class = "private" if is_private else "public"
              visibility_icon = "bi-lock-fill" if is_private else "bi-unlock-fill"
              repository_action = (
                  '<span class="qs-project-repository-state">Private repository</span>'
                  if is_private
                  else f'<a href="{html.escape(repository_url, quote=True)}">Repository</a>'
              )

              return [
                  '<article class="qs-project-tile">',
                  '<div class="qs-project-body">',
                  '<div class="qs-project-topline">',
                  '<span class="qs-project-type">PROJECT</span>',
                  f'<span class="qs-project-visibility qs-project-visibility-{visibility_class}" title="{html.escape(visibility, quote=True)}" aria-label="{html.escape(visibility, quote=True)}"><i class="bi {visibility_icon}" aria-hidden="true"></i></span>',
                  '</div>',
                  f'<h3><a href="{html.escape(target, quote=True)}">{html.escape(title)}</a></h3>',
                  f'<p class="qs-project-card-summary">{html.escape(summary)}</p>',
                  f'<div class="qs-project-footer"><span><strong>Stage:</strong> {html.escape(stage)} · {html.escape(context)}</span>{repository_action}</div>',
                  "</div>",
                  "</article>",
              ]


          def render_output'''
          updated, count = pattern.subn(replacement, script, count=1)
          if count != 1:
              raise SystemExit(f'Could not replace render_card; matches={count}')
          projects_script.write_text(updated, encoding='utf-8')

          css = ROOT / 'projects/research.css'
          css_text = css.read_text(encoding='utf-8')
          visibility_css = '''

          /* Repository visibility is explicit without exposing private GitHub links. */
          .qs-project-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .55rem;
          }

          .qs-project-visibility {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.45rem;
            height: 1.45rem;
            border-radius: 50%;
            font-size: .82rem;
            line-height: 1;
          }

          .qs-project-visibility-private {
            color: #9a6200;
            background: rgba(196, 132, 0, .11);
          }

          .qs-project-visibility-public {
            color: #39724d;
            background: rgba(57, 114, 77, .10);
          }

          .qs-project-repository-state {
            color: #6b7280;
            font-size: .84rem;
            white-space: nowrap;
          }
          '''.rstrip()
          if '.qs-project-visibility-private' not in css_text:
              css.write_text(css_text.rstrip() + visibility_css + '\n', encoding='utf-8')
          PY

      - name: Rebuild deterministic committed fragments
        run: |
          python scripts/build_publications.py
          python scripts/build_conferences.py
          python scripts/build_software.py
          python scripts/build_teaching.py
          python scripts/build_honors.py
          python scripts/build_data_resources.py
          python scripts/build_blog.py
          python scripts/build_research_graph.py
          python scripts/build_scholarly_graph.py
          python scripts/build_scholarly_infrastructure.py
          python scripts/build_reproducibility_certification.py
          python scripts/build_projects.py
          python scripts/build_home.py

      - name: Remove temporary workflow and commit changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-web-refinements-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Refine research visibility and public scholarly links'
          git push origin HEAD:apply-web-refinements-20260914
