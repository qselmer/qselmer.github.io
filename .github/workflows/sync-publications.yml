name: Sync publication catalogue

on:
  workflow_dispatch:
  schedule:
    # Weekly on Monday at 13:17 UTC (08:17 America/Lima).
    - cron: "17 13 * * 1"

permissions:
  contents: write

concurrency:
  group: sync-publications
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize publication metadata
        run: python scripts/sync_publications.py

      - name: Rebuild publication fragment
        run: python scripts/build_publications.py

      - name: Validate publication catalogue
        run: |
          python -m json.tool assets/data/publications.json >/dev/null
          python scripts/build_publications.py --check

      - name: Commit changes
        run: |
          if git diff --quiet -- assets/data/publications.json publications/_generated.md; then
            echo "No publication changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/publications.json publications/_generated.md
          git commit -m "chore: synchronize publication catalogue"
          git push
