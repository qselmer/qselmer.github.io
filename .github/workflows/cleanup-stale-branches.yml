name: One-time stale branch cleanup

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'qselmer/qselmer.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete stale non-master branches
        shell: bash
        run: |
          set -u
          branches=(
            "contact-project-logo-automation"
            "deploy-after-profile-sync"
            "feature/conference-sidebar-logos"
            "feature/conference-sidebar-refine"
            "feature/project-cards-researcher-sidebar"
            "feature/researcher-project-cards"
            "feature/sidebar-metrics-real-project-logos"
            "fix-cv-h1-validation"
            "harden-project-logo-sync"
            "posts-list-redesign"
            "sidebar-short-hyphen-cleanup"
            "site-cleanup-logos-metrics-cv-contact"
          )

          for branch in "${branches[@]}"; do
            echo "Deleting ${branch}"
            git push origin --delete "${branch}" || echo "Branch ${branch} is already absent"
          done

      - name: Remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-stale-branches.yml
          git commit -m "chore: remove one-time branch cleanup workflow"
          git push origin HEAD:master
