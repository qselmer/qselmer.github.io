name: Cleanup squash-merged branches

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/cleanup-squash-merged-branches-temp.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Delete verified merged PR branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in fix-conditional-metrics-qa-20260914 refine-research-stage-semantics-20260914; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting branch from merged PR: $branch"
              git push origin --delete "$branch"
            fi
          done

      - name: Remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cleanup-squash-merged-branches-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary squash-merge cleanup workflow'
          git push origin HEAD:master
