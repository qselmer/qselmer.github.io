name: Validate Quarto migration

on:
  push:
    branches:
      - migration/quarto-v1
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source state
        run: python scripts/validate_site.py source

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        uses: quarto-dev/quarto-actions/render@v2

      - name: Validate rendered site
        run: python scripts/validate_site.py rendered

      - name: Upload rendered preview
        uses: actions/upload-artifact@v4
        with:
          name: quarto-site-preview
          path: _site
