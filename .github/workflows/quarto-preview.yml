name: Validate Quarto migration

on:
  push:
    branches:
      - migration/quarto-v1
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate generated catalogues
        run: |
          python -m json.tool assets/data/publications.json >/dev/null
          python -m json.tool assets/data/conferences.json >/dev/null
          python -m json.tool assets/data/software.json >/dev/null
          python -m json.tool assets/data/teaching.json >/dev/null
          python -m json.tool talks/registry.json >/dev/null
          python -m json.tool software/registry.json >/dev/null
          python -m json.tool teaching/registry.json >/dev/null
          python -m json.tool data/registry.json >/dev/null
          python -m json.tool blog/registry.json >/dev/null
          python scripts/build_publications.py --check
          python scripts/build_conferences.py --check
          python scripts/build_software.py --check
          python scripts/build_teaching.py --check
          python scripts/build_data_resources.py --check
          python scripts/build_blog.py --check

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        uses: quarto-dev/quarto-actions/render@v2

      - name: Validate CV routes and PDF
        run: |
          test -s files/CV.pdf
          test -s _site/files/CV.pdf
          test -f _site/cv/index.html
          test -f _site/resume/index.html

      - name: Validate contact identity
        run: |
          test -f _site/contact/index.html
          grep -Fq "qselmers@gmail.com" _site/contact/index.html
          grep -Fq "elmer-quispe-salazar-104b6b1a4" _site/contact/index.html
          if grep -Fq "oquispe@imarpe.gob.pe" _site/contact/index.html; then
            echo "Legacy institutional email leaked into rendered Contact page"
            exit 1
          fi
          if grep -Fq "linkedin.com/in/qselmer/" _site/contact/index.html; then
            echo "Legacy LinkedIn slug leaked into rendered Contact page"
            exit 1
          fi

      - name: Upload rendered preview
        uses: actions/upload-artifact@v4
        with:
          name: quarto-site-preview
          path: _site
