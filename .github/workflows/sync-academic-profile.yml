name: Sync academic profile data

on:
  workflow_dispatch:
  schedule:
    # Weekly on Monday at 13:17 UTC (08:17 America/Lima),
    # after qselmer/qselmer refreshes its canonical profile at 11:27 UTC.
    - cron: "17 13 * * 1"

permissions:
  contents: write

concurrency:
  group: sync-academic-profile-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize and validate academic profile data
        run: python scripts/sync_profile.py

      - name: Commit synchronized artifacts
        shell: bash
        run: |
          mapfile -t TRACKED < <(python scripts/site_config.py tracked)
          if git diff --quiet -- "${TRACKED[@]}"; then
            echo "No academic profile changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${TRACKED[@]}"
          git commit -m "chore: synchronize academic profile data"
          git push
