name: Deploy Quarto site to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Sync academic profile data"
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild deterministic catalogue fragments
        run: |
          python scripts/build_publications.py
          python scripts/build_conferences.py
          python scripts/build_software.py
          python scripts/build_teaching.py
          python scripts/build_data_resources.py
          python scripts/build_blog.py
          python scripts/build_research_graph.py
          python scripts/build_scholarly_graph.py
          python scripts/build_projects.py
          python scripts/build_home.py

      - name: Validate source state
        run: python scripts/validate_site.py source

      - name: Validate Phase 6 source quality
        run: python scripts/validate_quality.py source

      - name: Validate Phase 7 scholarly graph
        run: python scripts/validate_phase7.py source

      - name: Validate generated research automation
        run: |
          python -m py_compile scripts/sync_project_logos.py scripts/sync_software_logos.py scripts/build_research_graph.py scripts/build_scholarly_graph.py scripts/build_projects.py scripts/build_software.py scripts/build_home.py scripts/validate_quality.py scripts/validate_phase7.py
          python scripts/build_research_graph.py --check
          python scripts/build_scholarly_graph.py --check
          python scripts/build_projects.py --check
          python scripts/build_home.py --check

      - name: Synchronize canonical visual assets for this build
        env:
          PROFILE_REPO_TOKEN: ${{ secrets.PROFILE_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/sync_project_logos.py
          python scripts/sync_software_logos.py
          python scripts/build_software.py
          python scripts/build_research_graph.py
          python scripts/build_scholarly_graph.py
          python scripts/build_projects.py
          python scripts/build_home.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Render website
        uses: quarto-dev/quarto-actions/render@v2

      - name: Validate rendered site
        run: python scripts/validate_site.py rendered

      - name: Validate Phase 6 rendered quality
        run: python scripts/validate_quality.py rendered

      - name: Validate Phase 7 rendered graph
        run: python scripts/validate_phase7.py rendered

      - name: Validate external links
        run: python scripts/check_external_links.py _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
