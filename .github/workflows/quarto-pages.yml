name: Deploy Quarto site to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source state
        run: python scripts/validate_site.py source

      - name: Validate project-card automation
        run: |
          python -m py_compile scripts/sync_project_logos.py scripts/build_projects.py
          python scripts/build_projects.py --check

      - name: Synchronize canonical project logos for this build
        env:
          PROFILE_REPO_TOKEN: ${{ secrets.PROFILE_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/sync_project_logos.py
          python scripts/build_projects.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Render website
        uses: quarto-dev/quarto-actions/render@v2

      - name: Validate rendered site
        run: python scripts/validate_site.py rendered

      - name: Validate external links
        run: python scripts/check_external_links.py _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
