name: One-time merged branch cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/cleanup-merged-branches-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Delete merged feature branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "curate-master-20260913"
            "feat/about-marine-identity"
            "feature/honors-awards"
            "fix/catalogue-output-format"
            "fix/scholarly-format-v2"
            "fix/unified-cards-qa"
            "fix/unify-research-cards"
            "fix-public-project-qa-20260913"
            "phase7/unified-scholarly-graph"
            "phase9/scholarly-visibility-preservation"
            "phase10/reproducibility-certification"
            "polish-public-catalogue-20260913"
            "refine-research-publications-talks-20260913"
          )
          for branch in "${branches[@]}"; do
            echo "Deleting merged branch: ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" || true
          done

      - name: Synchronize generated Honors artifacts
        run: python scripts/build_honors.py

      - name: Remove one-time workflow and commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cleanup-merged-branches-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "chore: finalize merged branch cleanup"
            git push origin master
          fi
