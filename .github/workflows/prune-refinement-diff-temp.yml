name: Prune refinement diff

on:
  push:
    branches:
      - apply-web-refinements-20260914

permissions:
  contents: write

jobs:
  prune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apply-web-refinements-20260914
          fetch-depth: 0
      - name: Restore unrelated generated artifacts
        shell: bash
        run: |
          git fetch origin master
          paths=(
            assets/data/conferences.json
            assets/data/reproducibility-certification.json
            assets/data/research-graph.json
            assets/data/scholarly-graph.json
            assets/data/scholarly-infrastructure.json
            blog/_generated.md
            blog/index.xml
            data/_generated.md
            includes/about-selected.html
            open-science/_generated.md
            reproducibility/_generated.md
            research-graph/_generated.md
            software/_generated.md
            talks/_generated.md
            teaching/_generated.md
          )
          for path in "${paths[@]}"; do
            if git cat-file -e "origin/master:${path}" 2>/dev/null; then
              git checkout origin/master -- "$path"
            else
              rm -f "$path"
              git add -A -- "$path" || true
            fi
          done
          rm -f .github/workflows/prune-refinement-diff-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Keep web refinement diff focused'
          git push origin HEAD:apply-web-refinements-20260914
