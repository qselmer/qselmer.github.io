---
layout: default
---

{% include base_path %}

<div id="main" class="homepage-main" role="main">
  {% include home-author-profile.html %}

  <article class="page page--home" itemscope itemtype="http://schema.org/CreativeWork">
    {% if page.title %}
      <meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">
    {% endif %}

    {% if page.excerpt %}
      <meta itemprop="description" content="{{ page.excerpt | markdownify | strip_html | strip_newlines | escape_once }}">
    {% endif %}

    <header class="home-hero">
      {% if page.title %}
        <h1>{{ page.title }}</h1>
      {% endif %}
    </header>

    <div class="page__inner-wrap">
      <section class="page__content" itemprop="text">
        {{ content }}
      </section>
    </div>
  </article>
</div>
