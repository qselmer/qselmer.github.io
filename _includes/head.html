{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
<link rel="stylesheet" href="{{ base_path }}/assets/css/site-base.css">
<link rel="stylesheet" href="{{ base_path }}/assets/css/site-layout.css">
<link rel="stylesheet" href="{{ base_path }}/assets/css/site-components.css">
<link rel="stylesheet" href="{{ base_path }}/assets/css/site-responsive.css">
{% if page.url == '/' %}
<link rel="stylesheet" href="{{ base_path }}/assets/css/page-specific/home.css">
{% elsif page.url contains '/publications/' or page.collection == 'publications' %}
<link rel="stylesheet" href="{{ base_path }}/assets/css/page-specific/publications.css">
{% elsif page.url contains '/research/' %}
<link rel="stylesheet" href="{{ base_path }}/assets/css/page-specific/research.css">
{% elsif page.url contains '/data/' %}
<link rel="stylesheet" href="{{ base_path }}/assets/css/page-specific/data.css">
{% endif %}
